# /etc/nginx/sites-available/play.zurich-boca.party
# 软链到 sites-enabled 后 nginx -t && systemctl reload nginx
#
# 证书用 Let's Encrypt（certbot certonly --webroot），不是本机其它站点共用的
# Cloudflare Origin CA 通配证书 —— 那张证书只覆盖 *.example.com。
# 首次签发步骤见 deploy/README.md。
# 注意：永远不要在这台机器上跑 `certbot --nginx`，它会改写既有站点配置，
# 有波及 example.com 上 别的服务的风险。

server {
    listen 80;
    listen [::]:80;
    server_name play.zurich-boca.party;

    # Let's Encrypt HTTP-01 校验。放在跳转之前，否则续期会失败。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.zurich-boca.party;

    ssl_certificate     /etc/letsencrypt/live/play.zurich-boca.party/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.zurich-boca.party/privkey.pem;

    # 一次可以传几张 10 MB 的板子图；要和 next.config.ts 的 serverActions.bodySizeLimit 一致
    client_max_body_size 32m;

    access_log /var/log/nginx/boc.access.log;
    error_log  /var/log/nginx/boc.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
