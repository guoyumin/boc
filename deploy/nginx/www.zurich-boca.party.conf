# /etc/nginx/sites-available/www.zurich-boca.party
# 社团主页。和 play.zurich-boca.party 是**同一个应用、同一个容器**（127.0.0.1:3100），
# 应用内部按 Host 头分流（见 src/proxy.ts），所以这里只是多一个 server 块。
#
# 证书同样用 Let's Encrypt（certbot certonly --webroot），一张证书带上 www 和根域：
#   sudo certbot certonly --webroot -w /var/www/html \
#        -d www.zurich-boca.party -d zurich-boca.party \
#        --non-interactive --agree-tos --register-unsafely-without-email --no-eff-email
# 用 `certonly --webroot`，不要用 `certbot --nginx` —— 后者会改写同机其它站点的配置。

server {
    listen 80;
    listen [::]:80;
    server_name www.zurich-boca.party zurich-boca.party;

    # Let's Encrypt HTTP-01 校验。放在跳转之前，否则续期会失败。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.zurich-boca.party$request_uri;
    }
}

# 根域 301 到 www，站点只有一个规范域名
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zurich-boca.party;

    ssl_certificate     /etc/letsencrypt/live/www.zurich-boca.party/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zurich-boca.party/privkey.pem;

    return 301 https://www.zurich-boca.party$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zurich-boca.party;

    ssl_certificate     /etc/letsencrypt/live/www.zurich-boca.party/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zurich-boca.party/privkey.pem;

    access_log /var/log/nginx/boc-www.access.log;
    error_log  /var/log/nginx/boc-www.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Host 必须原样透传：应用靠它区分主页站和功能站
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
