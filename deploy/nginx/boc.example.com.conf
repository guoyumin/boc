# /etc/nginx/sites-available/boc.example.com
# 软链到 sites-enabled 后 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name boc.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name boc.example.com;

    ssl_certificate     /etc/ssl/cloudflare/example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/example.com.key;

    # 板子图片上传（MVP）预留，单张 ≤ 10 MB
    client_max_body_size 12m;

    access_log /var/log/nginx/boc.access.log;
    error_log  /var/log/nginx/boc.error.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
