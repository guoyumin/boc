# /etc/nginx/sites-available/boc.example.com
# 旧域名，2026-09-06 起整站 301 到 play.zurich-boca.party。
# 微信群里散出去的旧链接还能用，所以这个站点先留着，不要删。

server {
    listen 80;
    listen [::]:80;
    server_name boc.example.com;
    return 301 https://play.zurich-boca.party$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boc.example.com;

    # 这张是本机共用的 Cloudflare Origin CA 通配证书，只覆盖 *.example.com
    ssl_certificate     /etc/ssl/cloudflare/example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/example.com.key;

    return 301 https://play.zurich-boca.party$request_uri;
}
